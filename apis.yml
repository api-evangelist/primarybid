name: PrimaryBid
description: 'PrimaryBid was a UK-based fintech that gave retail investors access to public
  capital markets — IPOs, follow-on equity raises, and public offerings that were historically
  restricted to institutional investors. It partnered with exchanges, banks, and issuers to
  broadcast live capital-raising events to individual investors, powering retail participation
  in listings such as Deliveroo, PensionBee, and Soho House. PrimaryBid''s technology was
  acquired by SoFi Technologies, Inc. in May 2026; the standalone consumer platform has been
  wound down and its public website now redirects former shareholders to third-party share
  registrars. This profile is retained in the API Evangelist network as a historical company
  record. No public developer portal, API documentation, or machine-readable API surface was
  found during enrichment.'
